# Eval cases for the competitive research agent.
#
# Each case is a business idea plus the competitors a good report should find.
# `expected` lists only the most obvious, well-established players: the agent picks up to
# 6 competitors, so finding other valid ones is fine. Recall = share of `expected` found.
# A competitor counts as found if any of its `domains` matches a selected competitor's
# homepage domain, or its name matches a selected competitor's name.
#
# STATUS: DRAFT. Competitor lists were written from general market knowledge and need
# a human check before the eval's recall numbers can be trusted. Set reviewed = true
# on each case once checked.

[[case]]
id = "meeting-notes-sales"
tags = ["b2b-saas", "crowded"]
idea = "An AI notetaker that joins Zoom and Google Meet sales calls, writes summaries, and pushes notes to the CRM."
reviewed = true
expected = [
  { name = "Gong", domains = ["gong.io"] },
  { name = "Fireflies.ai", domains = ["fireflies.ai"] },
  { name = "Otter.ai", domains = ["otter.ai"] },
  { name = "Fathom", domains = ["fathom.video", "fathom.ai"] },
]

