include:
  - infra/langfuse/compose.yml

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: research
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Applies database migrations, then exits. api and worker wait for it.
  migrate:
    build: ./src
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+psycopg://research:${POSTGRES_PASSWORD:-research}@postgres:5432/research
    volumes:
      - ./src:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./src
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://research:${POSTGRES_PASSWORD:-research}@postgres:5432/research
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app
      - ./.claude/hillclimb:/hillclimb
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./src
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://research:${POSTGRES_PASSWORD:-research}@postgres:5432/research
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    volumes:
      - ./src:/app
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # MCP server (streamable HTTP) for Claude Desktop / Claude Code: http://localhost:8001/mcp
  mcp:
    build: ./src
    command: python -m app.mcp_server --host 0.0.0.0 --port 8001
    environment:
      - RESEARCH_API_URL=http://api:8000
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./src:/app
    depends_on:
      - api

  # Next.js frontend: http://localhost:3001
  web:
    build: ./web
    environment:
      - API_URL=http://api:8000
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./web:/web
      - /web/node_modules
      - /web/.next
    depends_on:
      - api

  # Optional AWS emulation. Start with: docker compose --profile aws up -d
  localstack:
    image: localstack/localstack
    profiles: ["aws"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ecs,rds,sqs
      - DEBUG=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  postgres_data:
