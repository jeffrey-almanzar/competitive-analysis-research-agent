services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./src
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app
    depends_on:
      - redis

  worker:
    build: ./src
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: celery -A app.tasks worker --loglevel=info
    volumes:
      - ./src:/app
    depends_on:
      - redis

  # Optional AWS emulation. Start with: docker compose --profile aws up -d
  localstack:
    image: localstack/localstack
    profiles: ["aws"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ecs,rds,sqs
      - DEBUG=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
